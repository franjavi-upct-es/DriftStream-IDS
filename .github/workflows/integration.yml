# .github/workflows/integration.yml
# Manual/nightly integration tests and, from Phase 4, a reduced E0 as a
# regression guard on the theory-vs-empirical error.
name: integration

on:
    workflow_dispatch:
    schedule:
        - cron: "17 3 * * *"

permissions:
    contents: read

jobs:
    integration:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v6
              with:
                  enable-cache: true

            - name: Install Python and dependencies
              run: uv sync --frozen --all-groups

            - name: Integration tests
              # Exit code 5 means "no tests collected": expected until Phase 2.
              run: uv run pytest -m integration || [ $? -eq 5 ]
